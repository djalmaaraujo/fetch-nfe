services:
  # API HTTP: cadastro de empresas/certificados, sincronização e consulta por data
  api:
    build: .
    image: fetch-nfe
    container_name: fetch-nfe-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bind só em localhost: a API não tem auth — quem expõe é o proxy reverso
      - "127.0.0.1:${API_PORT:-8742}:8000"
    volumes:
      # rw: a API grava os .pfx enviados no cadastro
      - ./certs:/certs
      - ./data:/data
      - ./state:/state

  # Workers: scheduler (sincroniza todas as empresas em paralelo) + fila de manifestação
  worker:
    build: .
    image: fetch-nfe
    container_name: fetch-nfe-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers"]
    env_file:
      - .env
    volumes:
      - ./certs:/certs:ro
      - ./data:/data
      - ./state:/state
